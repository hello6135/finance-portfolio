<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>postEditor</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/postEditorStyle.css}">

    <!-- CKEditor 연결 -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>
        .ck-editor__editable {
            min-height: 300px;
            margin-bottom: 10px;
        }
    </style>

</head>

<body class="container mt-5">
    <h2>CK Editor</h2>

    <div class="card p-3 mb-4">
        <!-- 게시글 업로드 -->
        <form th:action="${post?.id == null} ? @{/posts/editor/create} : @{/posts/editor/{id}(id=${post.id})}"
            method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:if="${post?.id != null}" th:value="${post.id}">
            <div>
                <label for="title">제목</label>
                <input type="text" id="title" name="title" th:value="${post?.title}" required>
            </div>

            <div>
                <label for="editor">내용</label>
                <textarea id="editor" name="content" th:text="${post?.content}"></textarea>
            </div>
            <button type="submit" th:text="${post?.id == null} ? '저장하기' : '수정하기'"></button>
            <a href="/posts" class="btn btn-secondary">취소</a>
        </form>
    </div>

    <!-- CKEditor5 스크립트 -->
    <script>
        ClassicEditor
            .create(document.querySelector('#editor'), {
                // 이미지 업로드 핸들러 Controller와 연결
                ckfinder: {
                    uploadUrl: '/api/image/upload'
                },
                toolbar: ['heading', '|', 'bold', 'italic', 'link',
                    'bulletedList', 'numberedList', 'blockQuote', 'insertTable',
                    'imageUpload', 'undo', 'redo']
            })
            .then(editor => {
            })
            .catch(error => {
                console.error(error);
            });
    </script>
</body>

</html>
