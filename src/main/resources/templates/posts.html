<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>나의 커리어 게시판</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- CKEditor5 설정 -->
    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <style>
        .ck-editor__editable {
            min-height: 300px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body class="container mt-5">
    <h2>🚀 나의 커리어 게시f판 (CRUD)</h2>

    <div class="card p-3 mb-4">
        <form action="/posts/save" method="post" enctype="multipart/form-data">
            <!-- CKEditor 방식으로 변경 -->
            <!-- <input type="text" name="title" class="form-control mb-2" placeholder="제목 (예: 투운사 자격증 취득)" required>
            <textarea name="content" class="form-control mb-2" placeholder="내용을 입력하세요" required></textarea>
            <input type="file" name="image" class="form-control mb-2" accept="image/*">
            <button type="submit" class="btn btn-primary">게시글 올리기</button> -->
            <div>
                <label for="title">제목</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div>
                <label for="editor">내용</label>
                <textarea id="editor" name="content"></textarea>
            </div>

            <button type="submit">저장하기</button>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>제목</th>
                <th>내용</th>
                <th>시간</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}"></td>
                <!-- <td>
                    <div th:if="${post.imageUrl != null}">
                        <a th:href="@{|/images/${post.imageUrl}|}" target="_blank">
                            <img th:src="@{|/images/${post.imageUrl}|}" alt="이미지"
                                style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                        </a>
                    </div>
                    <div th:unless="${post.imageUrl != null}">
                        <span class="text-muted" style="font-size: 0.8rem;">noImg</span>
                    </div>
                </td> CKEditor방식으로 변경-->
                <td th:text="${post.title}"></td>
                <td th:utext="${post.content}"></td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd / HH:mm')}"></td>
                <td>
                    <form th:action="@{/posts/{id}(id=${post.id})}" th:method="delete">
                        <button type="submit">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <!-- CKEditor5 설정 -->
    <script>
        ClassicEditor
            .create(document.querySelector('#editor'), {
                // 이미지 업로드 핸들러 (나중에 Controller와 맞출 부분)
                ckfinder: {
                    uploadUrl: '/api/image/upload'
                },
                // 폰트 크기, 볼드 등 툴바 설정 (필요시 커스텀)
                toolbar: ['heading', '|', 'bold', 'italic', 'link',
                    'bulletedList', 'numberedList', 'blockQuote', 'insertTable',
                    'imageUpload', 'undo', 'redo']
            })
            .then(editor => {
                //console.log('Editor was initialized', editor); 브라우저 로그 지양
            })
            .catch(error => {
                console.error(error);
            });
    </script>
</body>

</html>
