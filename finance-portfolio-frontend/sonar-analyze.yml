# finance-portfolio-frontend/sonar-analyze.yml

sonar:
  projectKey: hello6135
  organization: ljh-finance
  projectName: Finance Portfolio
  projectVersion: 1.0.0
  
  # 분석 대상 설정
  sources: src
  sourceEncoding: UTF-8
  
  # 제외 대상 (빌드 결과물 및 라이브러리)
  exclusions: 
    - "**/node_modules/**"
    - "dist/**"
    - "**/*.test.jsx"
    - "**/*.test.js"
    - "**/.env"
  
  # JavaScript/TypeScript 전용 설정
  javascript:
    lcov:
      reportPaths: coverage/lcov.info