name: Backend CI (Verify & Test)

# main-deploy.yml에서 호출될 시 작동
on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 0

    # 브랜치에 따른 태그 결정
    - name: Set Docker Tag
      run: |
        if [ "${{ github.base_ref }}" == "main" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "TAG=latest" >> $GITHUB_ENV
        else
          echo "TAG=dev" >> $GITHUB_ENV
        fi

    # JDK 세팅 [SONAR]
    - name: (Sonar) Set up JDK 21 
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        # [성능] gradle 캐싱 (1~2분)
        cache: 'gradle'

    # [SONAR][성능] 실행 엔진 및 플러그인 캐싱 (20초)
    - name: (Sonar) Cache SonarCloud packages 
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # [SONAR][배포]
    - name: (Sonar) Code Quality Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        chmod +x gradlew

        # 빌드 위치, 이하 옵션 설명
        # [성능] 독립적인 프로젝트/모듈을 병렬로 빌드 - 모노레포에서 유리 (20초)
        # [성능] Gradle의 원격 빌드 캐시 기능을 활성화, 중복 계산 최소화 (30초)
        # [성능] 데몬 비활성화 (5초)
        # [안정성] 자바 힙 메모리 2GB로 명시 - 메모리 부족 방지 
        # [소나] 퀄리티 게이트 통과 대기
        # [소나] 퀄리티 게이트 최대 대기 시간 설정

        ./gradlew build sonar --info \
        --parallel \
        --build-cache \
        -Dorg.gradle.daemon=false \
        -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.qualitygate.timeout=300
      working-directory: ./finance-portfolio-backend

    # [DOCKER] Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # [DOCKER][성능] Buildx: Docker에 type=gha 캐싱 등 확장 기능 추가
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    # [DOCKER] 이미지 빌드 복사 및 푸시
    - name: Build and Push Docker Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ./finance-portfolio-backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/finance-portfolio:${{ env.TAG }}
        # [성능] Buildx: Docker 레이어 캐시 (라이브러리 캐싱)
        cache-from: type=gha
        cache-to: type=gha,mode=max