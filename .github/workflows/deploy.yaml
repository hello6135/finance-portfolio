name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    # 1. GitHub Actions 서버의 현재 IP를 알아냅니다.
    - name: Get GitHub Actions IP
      id: ip
      run: echo "ipv4=$(curl -s https://ipinfo.io/ip)" >> $GITHUB_OUTPUT

    # 2. AWS 권한 설정 (기존 IAM 키 사용)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    # 3. 배포 시작 전 22번 포트 일시 개방 (내 IP만)
    - name: Add GitHub IP to Security group
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "build/libs/*.jar"
        target: "/home/ubuntu/app"
        strip_components: 2

    - name: Execute Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 8080 포트를 점유 중인 프로세스가 있다면 종료 (없어도 에러 안 나게 || true 추가)
          sudo fuser -k 8080/tcp || true
          
          # 기존 앱 삭제 후 새 파일 실행 (경로 확인 필수)
          nohup java -jar /home/ubuntu/app/*.jar \
            --spring.profiles.active=dev \
            --AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} > /home/ubuntu/app/app.log 2>&1 &