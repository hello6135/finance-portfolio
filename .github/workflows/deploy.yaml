name: Deploy with Docker

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # 1. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 2. 브랜치에 따른 태그 결정
    - name: Set Docker Tag
      run: |
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "TAG=latest" >> $GITHUB_ENV
        else
          echo "TAG=dev" >> $GITHUB_ENV
        fi

    # 3. Docker 이미지 빌드 및 푸시 (Dockerfile의 Multi-stage 빌드 활용)
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/finance-portfolio:${{ env.TAG }}

    # 4. docker-compose.yml 파일을 EC2로 전송 (SCP)
    - name: Copy docker-compose.yml to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "docker-compose.yml"
        target: "~/finance-portfolio" # EC2 내 저장 경로

    # 5. EC2에 접속해서 배포 실행 (SSH)
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p ~/finance-portfolio
          cd ~/finance-portfolio
          
          # [핵심] 5-1. Secrets를 사용하여 .env 파일 동적 생성
          # docker-compose.yml이 이 파일을 읽어서 ${DB_PASSWORD} 등에 주입합니다.
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          
          # 5-2. Docker Hub 로그인 (이미지 pull 권한 확인)
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # 5-3. 최신 이미지 pull
          docker-compose pull
          
          # 5-4. 브랜치에 따라 컨테이너 실행
          if [ "${{ env.TAG }}" == "latest" ]; then
            docker-compose up -d app-prod db-prod
          else
            docker-compose up -d app-dev db-dev
          fi
          
          # 5-5. 미사용 이미지 정리 (용량 확보)
          docker image prune -f