name: Backend CD (Docker & EC2 Deploy)

# main-deploy.yml에서 호출될 시 작동
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # [DOCKER] Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 브랜치에 따른 태그 결정
    - name: Set Docker Tag
      run: |
        if [ "${{ github.base_ref }}" == "main" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "TAG=latest" >> $GITHUB_ENV
        else
          echo "TAG=dev" >> $GITHUB_ENV
        fi

    # [성능] Buildx: Docker에 type=gha 캐싱 등 확장 기능 추가
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # [DOCKER] 이미지 빌드 복사 및 푸시
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: ./finance-portfolio-backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/finance-portfolio:${{ env.TAG }}
        # [성능] Buildx: Docker 레이어 캐시 (라이브러리 캐싱)
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # [보안] GitHub Actions 서버의 공인 IP 가져오기
    - name: Get GitHub Actions IP
      id: ip
      run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

    # [보안] AWS Credentials 설정 (보안 그룹 제어용)
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    # [보안] EC2 보안 그룹에 22번 포트 임시 허용
    - name: Add GitHub IP to Security Group
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

    # [배포] docker-compose.yml 파일을 EC2로 전송 (SCP)
    - name: Copy docker-compose.yml to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "finance-portfolio-backend/docker-compose.yml"
        target: "~/finance-portfolio"
        strip_components: 1

    # [배포] EC2에 접속해서 배포 실행 (SSH)
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mkdir -p ~/finance-portfolio
          cd ~/finance-portfolio
          
          # 환경변수 파일(.env) 동적 생성
          cat <<EOF > .env
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CF_SECRET_KEY=${{ secrets.CF_SECRET_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          EOF
          
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker-compose pull
          
          if [ "${{ env.TAG }}" == "latest" ]; then
            docker-compose up -d --force-recreate app-prod db-prod
          else
            docker-compose up -d --force-recreate app-dev db-dev
          fi
          
          # [안정성] 디스크 용량 부족 방지
          docker image prune -f

    # [보안] 배포 완료 후 보안 그룹에서 IP 제거
    - name: Remove GitHub IP from Security Group
      if: always() # 빌드 실패와 상관없이 무조건 실행
      run: |
        if [ -z "${{ steps.ip.outputs.ipv4 }}" ]; then
          echo "Warning: GitHub Actions IP를 가져오지 못했습니다. 보안 그룹 정리를 건너뜁니다."
          exit 0
        fi
        
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ secrets.AWS_SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32
