name: Frontend Deploy to S3 (Dev & Prod)

on:
  push:
    branches: [ "main" ] # main 머지 시 prod 배포
    paths:
      - 'finance-portfolio-frontend/**'
  pull_request:
    branches: [ "develop" ] # develop PR 시 dev 배포 (빌드 테스트 및 배포)
    paths:
      - 'finance-portfolio-frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./finance-portfolio-frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # 환경 변수 설정 (브랜치에 따라 목적지 S3와 CDN ID 결정)
    - name: Set Environment Variables
      run: |
        if [ "${{ github.base_ref }}" == "develop" ] || [ "${{ github.ref }}" == "refs/heads/develop" ]; then
          echo "S3_BUCKET=${{ secrets.DEV_S3_BUCKET_NAME }}" >> $GITHUB_ENV
          echo "CF_ID=${{ secrets.DEV_CF_DISTRIBUTION_ID }}" >> $GITHUB_ENV
          echo "VITE_API_BASE_URL=${{ secrets.DEV_API_URL }}" >> $GITHUB_ENV
        else
          echo "S3_BUCKET=${{ secrets.PROD_S3_BUCKET_NAME }}" >> $GITHUB_ENV
          echo "CF_ID=${{ secrets.PROD_CF_DISTRIBUTION_ID }}" >> $GITHUB_ENV
          echo "VITE_API_BASE_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_ENV
        fi

    # Node.js 설정 및 빌드
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './finance-portfolio-frontend/package-lock.json'

    - name: Install dependencies
      run: npm install

    # 소나 실행 엔진 캐싱 (빌드 시간 단축)
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar    

    # 소나 분석
    - name: Frontend SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        npx @sonarsource/sonar-scanner \
          -Dproject.settings=sonar-project.properties

    - name: Build Project
      run: |
        # 빌드 시 환경별 API 주소 주입 (React 기준)
        VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }} npm run build

    # AWS 권한 설정
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    # S3에 빌드 결과물 업로드 (Sync)
    - name: Upload to S3
      run: |
        # dist/ 폴더 내용을 S3에 동기화, S3에만 있는 옛날 파일은 삭제(--delete)
        aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

    # CloudFront 캐시 무효화 (빌드 아티팩트 변경 시 캐시 삭제)
    - name: CloudFront Invalidation
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.CF_ID }} \
          --paths "/*"