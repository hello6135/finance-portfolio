name: Frontend CI (Verify & Build)

# main-deploy.yml에서 호출될 시 작동
on:
  workflow_call:
    inputs:
      target_env:
        description: '빌드 환경 상속'
        required: false
        type: string
        default: 'DEV'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./finance-portfolio-frontend
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # [NPM] Nodejs 셋업
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './finance-portfolio-frontend/package-lock.json'

    # [NPM] 의존성 설치
    - name: Install dependencies
      run: npm install

    # [NPM] 의존성 취약점이 발견되면 경고 로그 출력 (빌드는 진행)
    - name: Security Audit (npm audit)
      run: |
        npm audit --audit-level=high || echo "Warning: High-level NPM vulnerabilities found. Please review the log above."

    # [SONAR] 소나 실행 엔진 캐싱 (성능: 빌드 시간 단축)
    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # [SONAR] 소나 분석
    # 소나 퀄리티 게이트 300초 까지 대기 true
    - name: Frontend SonarCloud Scan
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        npx sonarqube-scanner \
          -Dproject.settings=sonar-project.properties \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=300

    # 품질 게이트 통과 후 빌드 수행
    # 빌드 환경 분기
    - name: Build Project
      run: |
        # 이벤트명 추출 (push, pull_request, workflow_dispatch)
        EVENT_NAME="${{ github.event_name }}"

        # 브랜치명 추출 (PR일 경우 base_ref인 develop/main 사용, push일 경우 ref에서 브랜치명만 잘라냄)
        if [ "$EVENT_NAME" == "pull_request" ]; then
          TARGET_BRANCH="${{ github.base_ref }}"
        else
          TARGET_BRANCH="${{ github.ref_name }}"
        fi

        # 추출한 이벤트명, 브랜치명 기준으로 빌드 환경 결정
        if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
          # 수동 실행 시 사용자가 선택한 inputs.target_env 기준
          TARGET_ENV="${{ inputs.target_env }}"
        elif [ "$TARGET_BRANCH" == "main" ]; then
          TARGET_ENV="PROD"
        else
          TARGET_ENV="DEV"
        fi

        echo "Event Name: $EVENT_NAME | Target Branch: $TARGET_BRANCH | Target Environment: $TARGET_ENV"

        # 앞서 결정된 PROD, DEV 기준으로 빌드 환경 분기
        if [ "$TARGET_ENV" == "PROD" ]; then
          echo "Building for PROD Environment..."
          VITE_API_BASE_URL="${{ secrets.PROD_API_URL }}" npm run build
        else
          echo "Building for DEV Environment..."
          VITE_API_BASE_URL="${{ secrets.DEV_API_URL }}" npm run build
        fi

    # 프론트 CD Job에서 사용할 수 있도록 빌드 결과물(dist) 임시 보존 (유지기간 1일)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
          name: frontend-dist
          path: ./finance-portfolio-frontend/dist/
          retention-days: 1